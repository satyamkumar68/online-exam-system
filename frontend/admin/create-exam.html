<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam - Online Examination System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="dashboard.html" class="navbar-brand">📚 Admin Portal</a>
            <ul class="navbar-menu">
                <li><a href="dashboard.html" class="navbar-link">Dashboard</a></li>
                <li><a href="exams.html" class="navbar-link">Exams</a></li>
                <li><a href="students.html" class="navbar-link">Students</a></li>
                <li id="user-info"></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="margin-top: 2rem; margin-bottom: 2rem;">
        <div id="alert-container"></div>

        <div class="card mb-4">
            <h1 style="color: var(--primary-color);">➕ Create New Exam</h1>
            <p style="color: var(--text-secondary);">Fill in the exam details and add questions</p>
        </div>

        <!-- Exam Details Form -->
        <div class="card mb-4">
            <div class="card-header">
                <h2 class="card-title">📋 Exam Details</h2>
            </div>
            <form id="exam-form">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label" for="exam-title">Exam Title *</label>
                        <input type="text" id="exam-title" class="form-control"
                            placeholder="e.g., Java Programming Final Exam" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="duration">Duration (minutes) *</label>
                        <input type="number" id="duration" class="form-control" placeholder="e.g., 60" min="1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Description</label>
                    <textarea id="description" class="form-control" placeholder="Exam description..."
                        rows="3"></textarea>
                </div>

                <div class="grid grid-2">
                    <div class="form-group">
                        <label class="form-label" for="total-marks">Total Marks *</label>
                        <input type="number" id="total-marks" class="form-control" placeholder="e.g., 100" min="1"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="passing-marks">Passing Marks *</label>
                        <input type="number" id="passing-marks" class="form-control" placeholder="e.g., 40" min="1"
                            required>
                    </div>
                </div>
            </form>
        </div>

        <!-- Questions Section -->
        <div class="card mb-4">
            <div class="card-header">
                <div class="d-flex justify-between align-center">
                    <h2 class="card-title">❓ Questions</h2>
                    <button class="btn btn-secondary" onclick="addQuestion()">➕ Add Question</button>
                </div>
            </div>
            <div id="questions-container">
                <p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No questions added yet.
                    Click "Add Question" to start.</p>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="d-flex justify-between">
            <button class="btn btn-outline" onclick="window.location.href='exams.html'">Cancel</button>
            <button class="btn btn-primary btn-lg" onclick="createExam()">Create Exam</button>
        </div>
    </div>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/auth.js?v=3"></script>
    <script>
        if (!checkAuth('ADMIN')) {
            window.location.href = '../login.html';
        }

        let questions = [];
        let questionCounter = 0;

        function addQuestion() {
            questionCounter++;
            const questionId = `q${questionCounter}`;

            questions.push({
                id: questionId,
                questionText: '',
                questionType: 'MCQ',
                marks: 1,
                correctOption: 'A',
                options: [
                    { label: 'A', text: '' },
                    { label: 'B', text: '' },
                    { label: 'C', text: '' },
                    { label: 'D', text: '' }
                ]
            });

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');

            if (questions.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No questions added yet. Click "Add Question" to start.</p>';
                return;
            }

            container.innerHTML = questions.map((q, index) => `
                <div class="card" style="margin-bottom: 1rem; border: 2px solid var(--border-color);">
                    <div class="d-flex justify-between align-center mb-3">
                        <h3 style="color: var(--primary-color);">Question ${index + 1}</h3>
                        <button class="btn btn-sm btn-danger" onclick="removeQuestion('${q.id}')">Remove</button>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Question Text *</label>
                        <textarea class="form-control" placeholder="Enter question..." 
                                  onchange="updateQuestion('${q.id}', 'questionText', this.value)" required>${q.questionText}</textarea>
                    </div>

                    <div class="grid grid-3">
                        <div class="form-group">
                            <label class="form-label">Type</label>
                            <select class="form-control" onchange="updateQuestion('${q.id}', 'questionType', this.value)">
                                <option value="MCQ" ${q.questionType === 'MCQ' ? 'selected' : ''}>Multiple Choice</option>
                                <option value="TRUE_FALSE" ${q.questionType === 'TRUE_FALSE' ? 'selected' : ''}>True/False</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Marks *</label>
                            <input type="number" class="form-control" value="${q.marks}" min="1"
                                   onchange="updateQuestion('${q.id}', 'marks', this.value)">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Correct Answer *</label>
                            <select class="form-control" onchange="updateQuestion('${q.id}', 'correctOption', this.value)">
                                <option value="A" ${q.correctOption === 'A' ? 'selected' : ''}>A</option>
                                <option value="B" ${q.correctOption === 'B' ? 'selected' : ''}>B</option>
                                <option value="C" ${q.correctOption === 'C' ? 'selected' : ''}>C</option>
                                <option value="D" ${q.correctOption === 'D' ? 'selected' : ''}>D</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Options *</label>
                        ${q.options.map(opt => `
                            <div class="d-flex gap-2 mb-2">
                                <strong style="min-width: 30px; padding-top: 0.75rem;">${opt.label}.</strong>
                                <input type="text" class="form-control" placeholder="Option ${opt.label}" value="${opt.text}"
                                       onchange="updateOption('${q.id}', '${opt.label}', this.value)" required>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function updateQuestion(questionId, field, value) {
            const question = questions.find(q => q.id === questionId);
            if (question) {
                question[field] = value;
            }
        }

        function updateOption(questionId, optionLabel, value) {
            const question = questions.find(q => q.id === questionId);
            if (question) {
                const option = question.options.find(o => o.label === optionLabel);
                if (option) {
                    option.text = value;
                }
            }
        }

        function removeQuestion(questionId) {
            questions = questions.filter(q => q.id !== questionId);
            renderQuestions();
        }

        async function createExam() {
            // Validate form
            const title = document.getElementById('exam-title').value;
            const description = document.getElementById('description').value;
            const duration = parseInt(document.getElementById('duration').value);
            const totalMarks = parseInt(document.getElementById('total-marks').value);
            const passingMarks = parseInt(document.getElementById('passing-marks').value);

            if (!title || !duration || !totalMarks || !passingMarks) {
                showAlert('Please fill in all required fields', 'error');
                return;
            }

            if (passingMarks > totalMarks) {
                showAlert('Passing marks cannot be greater than total marks', 'error');
                return;
            }

            if (questions.length === 0) {
                showAlert('Please add at least one question', 'error');
                return;
            }

            // Validate questions
            for (let i = 0; i < questions.length; i++) {
                const q = questions[i];
                if (!q.questionText || q.questionText.trim() === '') {
                    showAlert(`Question ${i + 1}: Please enter the question text`, 'error');
                    return;
                }
                for (let opt of q.options) {
                    if (!opt.text || opt.text.trim() === '') {
                        showAlert(`Question ${i + 1}: Please fill in option ${opt.label}`, 'error');
                        return;
                    }
                }
            }

            const examData = {
                examTitle: title,
                examDescription: description,
                durationMinutes: duration,
                totalMarks: totalMarks,
                passingMarks: passingMarks,
                questions: questions.map(q => ({
                    questionText: q.questionText,
                    questionType: q.questionType,
                    marks: parseInt(q.marks),
                    correctOption: q.correctOption,
                    options: q.options
                }))
            };

            try {
                const response = await apiRequest('/admin/exams', {
                    method: 'POST',
                    body: JSON.stringify(examData)
                });

                if (response.success) {
                    showAlert('Exam created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'exams.html';
                    }, 1500);
                } else {
                    showAlert('Failed to create exam: ' + response.message, 'error');
                }
            } catch (error) {
                console.error('Error creating exam:', error);
                showAlert('Failed to create exam. Please try again.', 'error');
            }
        }
    </script>
</body>

</html>
