<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Online Examination System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="dashboard.html" class="navbar-brand">📚 Admin Portal</a>
            <ul class="navbar-menu">
                <li><a href="dashboard.html" class="navbar-link">Dashboard</a></li>
                <li><a href="exams.html" class="navbar-link">Exams</a></li>
                <li><a href="students.html" class="navbar-link active">Students</a></li>
                <li id="user-info"></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="margin-top: 2rem;">
        <div id="alert-container"></div>

        <div class="card mb-4">
            <h1 style="color: var(--primary-color);">👥 Manage Students</h1>
            <p style="color: var(--text-secondary);">View and manage all registered students</p>
        </div>

        <div class="card">
            <div id="students-container">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/auth.js?v=3"></script>
    <script>
        if (!checkAuth('ADMIN')) {
            window.location.href = '../login.html';
        }

        async function loadStudents() {
            try {
                const response = await apiRequest('/admin/students');

                if (response.success) {
                    displayStudents(response.data || []);
                }
            } catch (error) {
                console.error('Error loading students:', error);
                document.getElementById('students-container').innerHTML =
                    '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No students registered yet.</p>';
            }
        }

        function displayStudents(students) {
            const container = document.getElementById('students-container');

            if (students.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No students registered yet.</p>';
                return;
            }

            container.innerHTML = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Registered</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${students.map(student => `
                                <tr>
                                    <td>${student.userId}</td>
                                    <td><strong>${student.fullName}</strong></td>
                                    <td>${student.username}</td>
                                    <td>${student.email}</td>
                                    <td>${formatDate(student.createdAt)}</td>
                                    <td>
                                        <span class="badge ${student.isActive ? 'badge-success' : 'badge-danger'}">
                                            ${student.isActive ? 'Active' : 'Inactive'}
                                        </span>
                                    </td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <button class="btn btn-sm btn-primary" onclick="viewStudent(${student.userId})">View</button>
                                            <button class="btn btn-sm btn-outline" onclick="toggleStatus(${student.userId}, ${student.isActive})">
                                                ${student.isActive ? 'Deactivate' : 'Activate'}
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function viewStudent(userId) {
            alert(`Viewing student ${userId}\n\nThis would show:\n- Student details\n- Exam history\n- Performance statistics\n- Proctoring violations`);
        }

        async function toggleStatus(userId, currentStatus) {
            const action = currentStatus ? 'deactivate' : 'activate';
            if (!confirm(`Are you sure you want to ${action} this student?`)) {
                return;
            }

            try {
                const response = await apiRequest(`/admin/students/${userId}/toggle`, {
                    method: 'PUT'
                });

                if (response.success) {
                    showAlert(`Student ${action}d successfully`, 'success');
                    loadStudents();
                } else {
                    showAlert('Failed to update student status', 'error');
                }
            } catch (error) {
                console.error('Error toggling student status:', error);
                showAlert('Failed to update student status', 'error');
            }
        }

        loadStudents();
    </script>
</body>

</html>
