<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams - Online Examination System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="dashboard.html" class="navbar-brand">📚 Admin Portal</a>
            <ul class="navbar-menu">
                <li><a href="dashboard.html" class="navbar-link">Dashboard</a></li>
                <li><a href="exams.html" class="navbar-link active">Exams</a></li>
                <li><a href="students.html" class="navbar-link">Students</a></li>
                <li id="user-info"></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="margin-top: 2rem;">
        <div id="alert-container"></div>

        <div class="card mb-4">
            <div class="d-flex justify-between align-center">
                <div>
                    <h1 style="color: var(--primary-color); margin-bottom: 0.5rem;">📝 Manage Exams</h1>
                    <p style="color: var(--text-secondary);">Create, edit, and manage all exams</p>
                </div>
                <button class="btn btn-primary" onclick="window.location.href='create-exam.html'">
                    ➕ Create New Exam
                </button>
            </div>
        </div>

        <div class="card">
            <div id="exams-container">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/auth.js?v=3"></script>
    <script>
        if (!checkAuth('ADMIN')) {
            window.location.href = '../login.html';
        }

        async function loadExams() {
            try {
                const response = await apiRequest('/admin/exams');

                if (response.success) {
                    displayExams(response.data || []);
                }
            } catch (error) {
                console.error('Error loading exams:', error);
                document.getElementById('exams-container').innerHTML =
                    '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No exams available. Create your first exam!</p>';
            }
        }

        function displayExams(exams) {
            const container = document.getElementById('exams-container');

            if (exams.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No exams created yet. Click "Create New Exam" to get started!</p>';
                return;
            }

            container.innerHTML = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Exam Title</th>
                                <th>Duration</th>
                                <th>Total Marks</th>
                                <th>Passing Marks</th>
                                <th>Questions</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${exams.map(exam => `
                                <tr>
                                    <td><strong>${exam.examTitle}</strong></td>
                                    <td>${exam.durationMinutes} min</td>
                                    <td>${exam.totalMarks}</td>
                                    <td>${exam.passingMarks}</td>
                                    <td>${exam.questionCount || 0}</td>
                                    <td>
                                        <span class="badge ${exam.isActive ? 'badge-success' : 'badge-danger'}">
                                            ${exam.isActive ? 'Active' : 'Inactive'}
                                        </span>
                                    </td>
                                    <td>
                                            <button class="btn btn-sm btn-secondary" onclick="openImportModal(${exam.examId})" style="background-color: var(--info-color); color: white;">Import CSV</button>
                                            <button class="btn btn-sm btn-primary" onclick="viewResults(${exam.examId})" style="background-color: var(--success-color); border-color: var(--success-color);">Results</button>
                                            <button class="btn btn-sm btn-outline" onclick="toggleStatus(${exam.examId}, ${exam.isActive})">
                                                ${exam.isActive ? 'Deactivate' : 'Activate'}
                                            </button>
                                            <button class="btn btn-sm btn-danger" onclick="deleteExam(${exam.examId})">Delete</button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function viewExam(examId) {
            alert(`Viewing exam ${examId}\n\nThis would show:\n- Exam details\n- All questions\n- Student attempts\n- Statistics`);
        }

        // View Results Logic
        async function viewResults(examId) {
            try {
                const response = await apiRequest(`/admin/exams/${examId}/attempts`);
                if (response.success) {
                    displayResultsModal(response.data || []);
                } else {
                    showAlert('Failed to load results', 'error');
                }
            } catch (error) {
                console.error('Error loading results:', error);
                showAlert('Failed to load results', 'error');
            }
        }

        function displayResultsModal(attempts) {
            const tbody = document.getElementById('resultsTableBody');

            if (attempts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 2rem;">No attempts found for this exam.</td></tr>';
            } else {
                tbody.innerHTML = attempts.map(attempt => `
                    <tr>
                        <td>${attempt.studentName} (${attempt.studentUsername})</td>
                        <td>${attempt.score}</td>
                        <td>
                            <span class="badge ${attempt.status === 'COMPLETED' ? 'badge-success' : 'badge-warning'}">
                                ${attempt.status}
                            </span>
                        </td>
                        <td>${new Date(attempt.endTime || attempt.startTime).toLocaleString()}</td>
                        <td>
                             <button class="btn btn-sm btn-outline" disabled>View Answers</button>
                        </td>
                    </tr>
                `).join('');
            }

            document.getElementById('resultsModal').style.display = 'block';
        }

        function closeResultsModal() {
            document.getElementById('resultsModal').style.display = 'none';
        }

        async function toggleStatus(examId, currentStatus) {
            const action = currentStatus ? 'deactivate' : 'activate';
            if (!confirm(`Are you sure you want to ${action} this exam?`)) {
                return;
            }

            try {
                const response = await apiRequest(`/admin/exams/${examId}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ isActive: !currentStatus })
                });

                if (response.success) {
                    showAlert(`Exam ${action}d successfully`, 'success');
                    loadExams();
                } else {
                    showAlert('Failed to update exam status', 'error');
                }
            } catch (error) {
                console.error('Error toggling exam status:', error);
                showAlert('Failed to update exam status', 'error');
            }
        }

        async function deleteExam(examId) {
            if (!confirm('Are you sure you want to delete this exam? This action cannot be undone!')) {
                return;
            }

            try {
                const response = await apiRequest(`/admin/exams/${examId}`, {
                    method: 'DELETE'
                });

                if (response.success) {
                    showAlert('Exam deleted successfully', 'success');
                    loadExams();
                } else {
                    showAlert('Failed to delete exam', 'error');
                }
            } catch (error) {
                console.error('Error deleting exam:', error);
                showAlert('Failed to delete exam', 'error');
            }
        }

        loadExams();

        // Import CSV Logic
        let currentImportExamId = null;

        function openImportModal(examId) {
            currentImportExamId = examId;
            document.getElementById('importModal').style.display = 'block';
        }

        function closeImportModal() {
            document.getElementById('importModal').style.display = 'none';
            document.getElementById('csvFile').value = '';
        }

        async function uploadCsv() {
            const fileInput = document.getElementById('csvFile');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a file');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/admin/exams/${currentImportExamId}/questions/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    closeImportModal();
                    loadExams();
                } else {
                    alert('Upload failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error uploading CSV:', error);
                alert('Upload failed. Check console.');
            }
        }
    </script>
</body>

<!-- Import Modal -->
<div id="importModal" class="modal"
    style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
    <div class="modal-content"
        style="background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 50%; border-radius: 8px;">
        <span class="close" onclick="closeImportModal()"
            style="color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer;">&times;</span>
        <h2 style="color: var(--primary-color);">Import Questions (CSV)</h2>
        <p>Upload a CSV file with columns:
            <code>Question Text, Type, Marks, Option A, Option B, Option C, Option D, Correct Option</code>
        </p>
        <div style="margin: 20px 0;">
            <input type="file" id="csvFile" accept=".csv" class="form-control">
        </div>
        <div style="text-align: right;">
            <button class="btn btn-outline" onclick="closeImportModal()">Cancel</button>
            <button class="btn btn-primary" onclick="uploadCsv()">Upload</button>
        </div>
    </div>
</div>

<!-- Results Modal -->
<div id="resultsModal" class="modal"
    style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
    <div class="modal-content"
        style="background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 80%; border-radius: 8px;">
        <span class="close" onclick="closeResultsModal()"
            style="color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer;">&times;</span>
        <h2 style="color: var(--primary-color);">Exam Results</h2>
        <div class="table-container" style="max-height: 400px; overflow-y: auto; margin-top: 1rem;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr style="background-color: #f8f9fa;">
                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6;">Student</th>
                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6;">Score</th>
                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6;">Status</th>
                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6;">Date</th>
                        <th style="padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6;">Actions</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                    <!-- Results populated by JS -->
                </tbody>
            </table>
        </div>
        <div style="text-align: right; margin-top: 20px;">
            <button class="btn btn-outline" onclick="closeResultsModal()">Close</button>
        </div>
    </div>
</div>

</html>
