<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Examination System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container" style="max-width: 450px; margin-top: 100px;">
        <div class="card">
            <div class="text-center mb-3">
                <h1 style="color: var(--primary-color);">📚 Exam Portal</h1>
                <p>Login to your account</p>
            </div>

            <div id="alert-container"></div>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username"
                        autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>

            <div class="text-center mt-3">
                <p>Don't have an account? <a href="register.html"
                        style="color: var(--primary-color); font-weight: 600;">Register here</a></p>
            </div>

            <div class="mt-3" style="padding: 15px; background: var(--light-bg); border-radius: 8px;">
                <p style="font-size: 14px; margin: 0;"><strong>Demo Credentials:</strong></p>
                <p style="font-size: 14px; margin: 5px 0 0 0;">
                    Admin: <code>newuser456</code> / <code>password123</code><br>
                    Student: <code>testuser999</code> / <code>password123</code>
                </p>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=3"></script>
    <script src="js/auth.js?v=3"></script>
</body>

</html>
