<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Exam - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="admin_dashboard.html">Admin Panel</a>
            <a href="admin_dashboard.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-house-door"></i> Return to Dashboard
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4>Create New Exam</h4>
                    </div>
                    <div class="card-body">
                        <form id="createExamForm">
                            <div class="mb-3">
                                <label for="title" class="form-label">Exam Title</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="maxTime" class="form-label">Time Limit (minutes)</label>
                                <input type="number" class="form-control" id="maxTime" value="60" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="startTime" class="form-label">Start Time</label>
                                    <input type="datetime-local" class="form-control" id="startTime" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="endTime" class="form-label">End Time</label>
                                    <input type="datetime-local" class="form-control" id="endTime" required>
                                </div>
                            </div>
                            <div id="message" class="alert d-none"></div>
                            <button type="submit" class="btn btn-primary">Create Exam</button>
                            <a href="admin_dashboard.html" class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkAuth();

        document.getElementById('createExamForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const examData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                maxTimeMinutes: parseInt(document.getElementById('maxTime').value),
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value
            };

            const msgDiv = document.getElementById('message');

            try {
                const response = await apiFetch('/admin/exams', {
                    method: 'POST',
                    body: JSON.stringify(examData)
                });

                if (response.ok) {
                    msgDiv.className = 'alert alert-success';
                    msgDiv.textContent = 'Exam created successfully! Redirecting...';
                    msgDiv.classList.remove('d-none');
                    setTimeout(() => window.location.href = 'admin_dashboard.html', 1500);
                } else {
                    const data = await response.json();
                    msgDiv.className = 'alert alert-danger';
                    msgDiv.textContent = data.message || 'Failed to create exam';
                    msgDiv.classList.remove('d-none');
                }
            } catch (error) {
                msgDiv.className = 'alert alert-danger';
                msgDiv.textContent = 'Network error';
                msgDiv.classList.remove('d-none');
            }
        });
    </script>
</body>

</html>
