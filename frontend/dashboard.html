<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Online Exam System</a>
            <button class="btn btn-outline-light" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">Welcome, <span id="username">User</span>!</h2>
                        <p class="card-text">You are logged in as: <span id="role"
                                class="badge bg-primary">Student</span></p>
                        <hr>
                        <h4>Available Exams</h4>
                        <div class="alert alert-info">
                            No exams available at the moment.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
            // Redirect Admin to Admin Dashboard
            if (user.roles.includes("ADMIN")) {
                window.location.href = "admin_dashboard.html";
            } else if (user.roles.includes("STUDENT")) {
                window.location.href = 'student_dashboard.html';
            }

            document.getElementById('username').textContent = user.fullName || user.username;
            document.getElementById('role').textContent = user.roles[0];
        }
    </script>
</body>

</html>
