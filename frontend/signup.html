<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        .btn-primary {
            background: #764ba2;
            border: none;
        }

        .btn-primary:hover {
            background: #5a387e;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h3 class="text-center mb-4">Create Account</h3>
        <form id="signupForm">
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div id="message" class="alert d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>
        </form>
        <div class="text-center mt-3">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Inline signup function to avoid browser caching issues with auth.js
        async function registerStudent(username, email, password, fullName) {
            try {
                // Ensure API_BASE_URL is defined, fallback if needed (though api.js should load it)
                const baseUrl = (typeof API_BASE_URL !== 'undefined') ? API_BASE_URL : 'http://127.0.0.1:8081/api';

                const response = await fetch(`${baseUrl}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password, fullName, role: "student" })
                });

                const data = await response.json();

                if (response.ok) {
                    return { success: true, message: data.message };
                } else {
                    return { success: false, message: data.message || 'Signup failed' };
                }
            } catch (error) {
                console.error(error);
                return { success: false, message: 'Network error. Please check your connection.' };
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('message');
            const submitBtn = e.target.querySelector('button');

            msgDiv.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';

            // Use the inlined function
            const result = await registerStudent(username, email, password, fullName);

            msgDiv.classList.remove('d-none');
            if (result.success) {
                msgDiv.className = 'alert alert-success';
                msgDiv.textContent = 'Registration successful! Redirecting to login...';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                msgDiv.className = 'alert alert-danger';
                msgDiv.textContent = result.message;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign Up';
            }
        });
    </script>
</body>

</html>
