<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="#">
                <span class="text-primary">Admin</span>Portal
            </a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-light" id="adminName">Admin</span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">Dashboard Overview</h2>
            <div class="d-flex gap-2">
                <a href="question_bank.html" class="btn btn-outline-primary shadow-sm">
                    <i class="bi bi-collection"></i> Question Bank
                </a>
                <a href="create_exam.html" class="btn btn-primary shadow-sm">
                    <i class="bi bi-plus-lg"></i> Create New Exam
                </a>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="row mb-4 g-3">
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 stats-card">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted text-uppercase mb-2">Total Students</h6>
                            <h2 class="mb-0 fw-bold text-primary" id="totalStudents">-</h2>
                        </div>
                        <div class="icon-box bg-primary-subtle text-primary rounded-circle p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                                class="bi bi-people" viewBox="0 0 16 16">
                                <path
                                    d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1A.2.2 0 0 1 7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002a.2.2 0 0 1-.197.13H7.022ZM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a5.88 5.88 0 0 0-1.23-.247A7.35 7.35 0 0 0 5 9c-4 0-5 3-5 4 0 .667.333 1 1 1h4.216A2.238 2.238 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.493 5.493 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4" />
                            </svg>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-0">
                        <a href="manage_students.html" class="text-decoration-none small text-muted stretched-link">View
                            Details &rarr;</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 stats-card">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted text-uppercase mb-2">Total Exams</h6>
                            <h2 class="mb-0 fw-bold text-success" id="totalExams">-</h2>
                        </div>
                        <div class="icon-box bg-success-subtle text-success rounded-circle p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                                class="bi bi-file-text" viewBox="0 0 16 16">
                                <path
                                    d="M5 4a.5.5 0 0 0 0 1h6a.5.5 0 0 0 0-1zm-.5 2.5A.5.5 0 0 1 5 6h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5m.5 2.5a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1z" />
                                <path
                                    d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2zm10-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card border-0 shadow-sm h-100 stats-card">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted text-uppercase mb-2">Avg Score</h6>
                            <h2 class="mb-0 fw-bold text-warning" id="avgScore">-%</h2>
                        </div>
                        <div class="icon-box bg-warning-subtle text-warning rounded-circle p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                                class="bi bi-activity" viewBox="0 0 16 16">
                                <path fill-rule="evenodd"
                                    d="M6 2a.5.5 0 0 1 .47.33L10 12.036l1.53-4.208A.5.5 0 0 1 12 7.5h3.5a.5.5 0 0 1 0 1h-3.15l-1.88 5.17a.5.5 0 0 1-.94 0L6 3.964 4.47 8.171A.5.5 0 0 1 4 8.5H.5a.5.5 0 0 1 0-1h3.15l1.88-5.17A.5.5 0 0 1 6 2" />
                            </svg>
                        </div>
                    </div>
                    <div class="card-footer bg-transparent border-0">
                        <a href="view_results.html" class="text-decoration-none small text-muted stretched-link">View
                            Analysis &rarr;</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts & Tables Row -->
        <div class="row g-4 mb-4">
            <!-- Chart Column -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white border-0 py-3">
                        <h5 class="card-title fw-bold mb-0">Performance Overview</h5>
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <div style="height: 250px; width: 100%;">
                            <canvas id="passFailChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Exam List Column -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title fw-bold mb-0">Exam Management</h5>
                        <button class="btn btn-sm btn-link text-decoration-none" onclick="loadExams()">Refresh</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th class="ps-4">Title</th>
                                    <th>Duration</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="examTableBody" class="border-top-0">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Styles -->
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .stats-card {
            transition: transform 0.2s;
        }

        .stats-card:hover {
            transform: translateY(-5px);
        }

        .icon-box {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table thead th {
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: #4361ee;
            border-color: #4361ee;
        }

        .btn-primary:hover {
            background-color: #3f37c9;
            border-color: #3f37c9;
        }

        .text-primary {
            color: #4361ee !important;
        }

        .bg-primary-subtle {
            background-color: rgba(67, 97, 238, 0.1) !important;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || !user.roles.includes("ADMIN")) {
            window.location.href = 'dashboard.html';
        }
        document.getElementById('adminName').textContent = user.fullName || user.username;

        async function loadAnalytics() {
            try {
                const response = await apiFetch('/admin/analytics');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('totalStudents').textContent = data.totalStudents;
                    document.getElementById('totalExams').textContent = data.totalExams;
                    document.getElementById('avgScore').textContent = data.averageScore.toFixed(1) + '%';

                    renderChart(data.passCount, data.failCount);
                }
            } catch (e) { console.error("Analytics Error", e); }
        }

        function renderChart(pass, fail) {
            const ctx = document.getElementById('passFailChart').getContext('2d');
            // Check if no data
            if (pass === 0 && fail === 0) {
                // Mock data for display if empty
                pass = 1; fail = 0;
            }

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Passed', 'Failed'],
                    datasets: [{
                        data: [pass, fail],
                        backgroundColor: ['#4cc9f0', '#f72585'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return ' ' + context.label + ': ' + context.raw;
                                }
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        async function loadExams() {
            try {
                const response = await apiFetch('/admin/exams');
                if (response.ok) {
                    const exams = await response.json();
                    const tbody = document.getElementById('examTableBody');
                    tbody.innerHTML = '';

                    exams.forEach(exam => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="ps-4 fw-bold text-dark">${exam.title}</td>
                            <td><span class="text-muted"><i class="bi bi-clock"></i> ${exam.maxTimeMinutes} min</span></td>
                            <td>${exam.isActive ? '<span class="badge bg-success-subtle text-success border border-success px-2">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td>
                            <td class="text-end pe-4">
                                <a href="add_questions.html?examId=${exam.id}" class="btn btn-sm btn-outline-primary shadow-sm" style="border-radius: 20px;">
                                    Add Questions
                                </a>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Error loading exams:", error);
            }
        }

        loadAnalytics();
        loadExams();
    </script>
</body>

</html>
