<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Online Examination System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="dashboard.html" class="navbar-brand">📚 Exam Portal</a>
            <ul class="navbar-menu">
                <li><a href="dashboard.html" class="navbar-link active">Dashboard</a></li>
                <li><a href="results.html" class="navbar-link">My Results</a></li>
                <li id="user-info"></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container" style="margin-top: 2rem;">
        <div id="alert-container"></div>

        <!-- Welcome Section -->
        <div class="card mb-4">
            <h1 style="color: var(--primary-color); margin-bottom: 0.5rem;">Welcome, <span id="student-name"></span>! 👋
            </h1>
            <p style="color: var(--text-secondary);">Here are your available exams and recent activities.</p>
        </div>

        <!-- Statistics Grid -->
        <div class="grid grid-3 mb-4">
            <div class="stat-card" style="border-left-color: var(--primary-color);">
                <div class="stat-value" id="total-exams">0</div>
                <div class="stat-label">Available Exams</div>
            </div>
            <div class="stat-card" style="border-left-color: var(--success-color);">
                <div class="stat-value" id="completed-exams">0</div>
                <div class="stat-label">Completed Exams</div>
            </div>
            <div class="stat-card" style="border-left-color: var(--accent-color);">
                <div class="stat-value" id="average-score">0%</div>
                <div class="stat-label">Average Score</div>
            </div>
        </div>

        <!-- Available Exams -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">📝 Available Exams</h2>
                <p class="card-subtitle">Click on an exam to start</p>
            </div>
            <div id="exams-container">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="../js/api.js?v=3"></script>
    <script src="../js/auth.js?v=3"></script>
    <script>
        // Check authentication
        if (!checkAuth('STUDENT')) {
            window.location.href = '../login.html';
        }

        // Load student data
        async function loadDashboard() {
            const user = getUser();
            document.getElementById('student-name').textContent = user.fullName;

            try {
                // Load available exams
                const response = await apiRequest('/student/exams/available');

                if (response.success) {
                    displayExams(response.data || []);
                    updateStatistics(response.data || []);
                } else {
                    showAlert('Failed to load exams', 'error');
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('exams-container').innerHTML =
                    '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No exams available at the moment.</p>';
            }
        }

        function displayExams(exams) {
            const container = document.getElementById('exams-container');

            if (exams.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No exams available at the moment.</p>';
                return;
            }

            container.innerHTML = exams.map(exam => {
                const title = escapeHtml(exam.examTitle);
                const desc = escapeHtml(exam.examDescription || 'No description');

                return `
                <div class="card" style="margin-bottom: 1rem; cursor: pointer;" onclick="startExam(${exam.examId})">
                    <div class="d-flex justify-between align-center">
                        <div>
                            <h3 style="color: var(--primary-color); margin-bottom: 0.5rem;">${title}</h3>
                            <p style="color: var(--text-secondary); margin-bottom: 1rem;">${desc}</p>
                            <div class="d-flex gap-3" style="flex-wrap: wrap;">
                                <span style="font-size: 0.875rem;">⏱️ ${exam.durationMinutes} minutes</span>
                                <span style="font-size: 0.875rem;">📊 ${exam.totalMarks} marks</span>
                                <span style="font-size: 0.875rem;">✅ Passing: ${exam.passingMarks} marks</span>
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="startExam(${exam.examId}); event.stopPropagation();">
                            Start Exam →
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function updateStatistics(exams) {
            document.getElementById('total-exams').textContent = exams.length;
            // These would be fetched from API in real implementation
            document.getElementById('completed-exams').textContent = '0';
            document.getElementById('average-score').textContent = '0%';
        }

        function startExam(examId) {
            if (confirm('Are you ready to start the exam? Make sure you have a stable internet connection and your webcam is working.')) {
                window.location.href = `exam.html?examId=${examId}`;
            }
        }

        // Load dashboard on page load
        loadDashboard();
    </script>
</body>

</html>
