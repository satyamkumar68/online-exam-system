<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="admin_dashboard.html">Admin Panel</a>
            <a href="admin_dashboard.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-house-door"></i> Return to Dashboard
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <h3>Exam Results</h3>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student</th>
                    <th>Exam</th>
                    <th>Score</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody">
                <!-- Results loaded here -->
            </tbody>
        </table>
        <a href="admin_dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkAuth();

        async function loadResults() {
            try {
                const response = await apiFetch('/admin/results');
                if (response.ok) {
                    const results = await response.json();
                    const tbody = document.getElementById('resultsTableBody');
                    tbody.innerHTML = '';

                    if (results.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No results found (Students need to attempt exams first).</td></tr>';
                        return;
                    }

                    results.forEach(result => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${result.id}</td>
                            <td>${result.user ? (result.user.fullName || result.user.username) : 'Unknown'}</td>
                            <td>${result.exam ? result.exam.title : 'Unknown'}</td>
                            <td>${result.score} / ${result.totalQuestions}</td>
                            <td>${new Date(result.attemptDate).toLocaleString()}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Error loading results:", error);
            }
        }

        loadResults();
    </script>
</body>

</html>
