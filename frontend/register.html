<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Examination System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container" style="max-width: 500px; margin-top: 50px;">
        <div class="card">
            <div class="text-center mb-3">
                <h1 style="color: var(--primary-color);">📝 Student Registration</h1>
                <p>Create your account</p>
            </div>

            <div id="alert-container"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Choose username" required
                        minlength="3">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Create password" required
                        minlength="8">
                    <small style="color: var(--text-secondary);">Minimum 8 characters (uppercase, lowercase, number,
                        special character)</small>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password"
                        required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>

            <div class="text-center mt-3">
                <p>Already have an account? <a href="login.html"
                        style="color: var(--primary-color); font-weight: 600;">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=3"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const alertContainer = document.getElementById('alert-container');

            if (password !== confirmPassword) {
                displayAlert('alert-container', 'Passwords do not match!', 'error');
                return;
            }

            try {
                const response = await fetch(API_BASE_URL + '/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fullName,
                        username,
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayAlert('alert-container', 'Registration successful! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    displayAlert('alert-container', data.message, 'error');
                }
            } catch (error) {
                displayAlert('alert-container', 'Registration failed. Please try again.', 'error');
            }
        });
    </script>
</body>

</html>
