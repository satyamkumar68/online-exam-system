<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="admin_dashboard.html">Admin Panel</a>
            <a href="admin_dashboard.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-house-door"></i> Return to Dashboard
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <h3>Registered Students</h3>
        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- Students loaded here -->
            </tbody>
        </table>
        <a href="admin_dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkAuth();

        async function loadStudents() {
            try {
                const response = await apiFetch('/admin/students');
                if (response.ok) {
                    const students = await response.json();
                    const tbody = document.getElementById('studentTableBody');
                    tbody.innerHTML = '';

                    if (students.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center">No students found.</td></tr>';
                        return;
                    }

                    students.forEach(student => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${student.id}</td>
                            <td>${student.fullName || '-'}</td>
                            <td>${student.username}</td>
                            <td>${student.email}</td>
                            <td><span class="badge bg-secondary">${student.role}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Error loading students:", error);
            }
        }

        loadStudents();
    </script>
</body>

</html>
