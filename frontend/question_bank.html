<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank - Online Examination System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="admin_dashboard.html">
                <span class="text-primary">Admin</span>Portal
            </a>
            <div class="d-flex align-items-center">
                <a href="admin_dashboard.html" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-house-door"></i> Dashboard
                </a>
                <span class="navbar-text me-3 text-light" id="adminName">Admin</span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">Question Bank</h2>
            <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#addQuestionModal">
                <i class="bi bi-plus-lg"></i> Add Question
            </button>
        </div>

        <!-- Filter by Category -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Filter by Category:</label>
                    </div>
                    <div class="col-md-6">
                        <select class="form-select" id="categoryFilter" onchange="filterQuestions()">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="col-md-3 text-end">
                        <span class="badge bg-primary rounded-pill px-3 py-2" id="questionCount">0 Questions</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Questions List -->
        <div class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4">Question</th>
                            <th>Category</th>
                            <th>Options</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="questionsTableBody">
                        <tr>
                            <td colspan="4" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="text-muted mt-2">Loading questions...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add Question Modal -->
    <div class="modal fade" id="addQuestionModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Question to Bank</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="questionForm">
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" id="category"
                                placeholder="e.g., Java Basics, SQL, Math" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Question</label>
                            <textarea class="form-control" id="content" rows="3" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Option 1</label>
                                <input type="text" class="form-control" id="option1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Option 2</label>
                                <input type="text" class="form-control" id="option2" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Option 3</label>
                                <input type="text" class="form-control" id="option3" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Option 4</label>
                                <input type="text" class="form-control" id="option4" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correct Answer</label>
                            <select class="form-select" id="answer" required>
                                <option value="">Select correct option</option>
                                <option value="option1">Option 1</option>
                                <option value="option2">Option 2</option>
                                <option value="option3">Option 3</option>
                                <option value="option4">Option 4</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="addQuestion()">Add to Bank</button>
                </div>
            </div>
        </div>
    </div>

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .table thead th {
            font-weight: 600;
            color: #555;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background-color: #4361ee;
            border-color: #4361ee;
        }

        .btn-primary:hover {
            background-color: #3f37c9;
            border-color: #3f37c9;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        checkAuth();
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || !user.roles.includes("ADMIN")) {
            window.location.href = 'dashboard.html';
        }
        document.getElementById('adminName').textContent = user.fullName || user.username;

        let allQuestions = [];

        async function loadQuestions() {
            try {
                const response = await apiFetch('/admin/question-bank');
                if (response.ok) {
                    allQuestions = await response.json();
                    renderQuestions(allQuestions);
                    loadCategories();
                }
            } catch (error) {
                console.error("Error loading questions:", error);
            }
        }

        async function loadCategories() {
            try {
                const response = await apiFetch('/admin/question-bank/categories');
                if (response.ok) {
                    const categories = await response.json();
                    const select = document.getElementById('categoryFilter');
                    select.innerHTML = '<option value="">All Categories</option>';
                    categories.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat;
                        option.textContent = cat;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error("Error loading categories:", error);
            }
        }

        function renderQuestions(questions) {
            const tbody = document.getElementById('questionsTableBody');
            tbody.innerHTML = '';
            document.getElementById('questionCount').textContent = questions.length + ' Questions';

            if (questions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted">No questions in bank yet.</td></tr>';
                return;
            }

            questions.forEach(q => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-4">
                        <div class="fw-bold text-dark">${q.content.substring(0, 80)}${q.content.length > 80 ? '...' : ''}</div>
                    </td>
                    <td><span class="badge bg-info-subtle text-info border border-info px-2">${q.category || 'Uncategorized'}</span></td>
                    <td><small class="text-muted">4 options</small></td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(${q.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterQuestions() {
            const category = document.getElementById('categoryFilter').value;
            if (category === '') {
                renderQuestions(allQuestions);
            } else {
                const filtered = allQuestions.filter(q => q.category === category);
                renderQuestions(filtered);
            }
        }

        async function addQuestion() {
            const questionData = {
                content: document.getElementById('content').value,
                option1: document.getElementById('option1').value,
                option2: document.getElementById('option2').value,
                option3: document.getElementById('option3').value,
                option4: document.getElementById('option4').value,
                answer: document.getElementById('answer').value,
                category: document.getElementById('category').value
            };

            console.log('Sending question data:', questionData);

            try {
                const response = await apiFetch('/admin/question-bank', {
                    method: 'POST',
                    body: JSON.stringify(questionData)
                });

                console.log('Response status:', response.status);

                if (response.ok) {
                    alert('Question added to bank successfully!');
                    document.getElementById('questionForm').reset();
                    bootstrap.Modal.getInstance(document.getElementById('addQuestionModal')).hide();
                    loadQuestions();
                } else {
                    const errorText = await response.text();
                    console.error('Backend error:', errorText);
                    alert('Failed to add question. Error: ' + errorText);
                }
            } catch (error) {
                console.error("Error adding question:", error);
                alert('Error adding question: ' + error.message);
            }
        }

        async function deleteQuestion(id) {
            if (!confirm('Are you sure you want to delete this question?')) return;

            try {
                const response = await apiFetch(`/admin/questions/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Question deleted successfully!');
                    loadQuestions();
                } else {
                    alert('Failed to delete question');
                }
            } catch (error) {
                console.error("Error deleting question:", error);
            }
        }

        loadQuestions();
    </script>
</body>

</html>
